version: "3.8"

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-dev
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=${N8N_PORT:-5678}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - NODE_ENV=${NODE_ENV:-development}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-n8n_secret}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-super-secret-enterprise-encryption-key-32chars}
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
    volumes:
      - n8n_storage:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      mock-services:
        condition: service_started
    networks:
      - n8n_network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: n8n-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-n8n_secret}
      - POSTGRES_DB=${POSTGRES_DB:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - n8n_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: n8n-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - n8n_network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: n8n-mailhog
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP
    networks:
      - n8n_network

  mock-services:
    build:
      context: ./mock-services
      dockerfile: Dockerfile
    container_name: n8n-mock-services
    restart: unless-stopped
    ports:
      - "${MOCK_SERVICES_PORT:-4000}:4000"
    environment:
      - PORT=4000
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET:-sample_slack_signing_secret_12345}
    networks:
      - n8n_network

volumes:
  n8n_storage:
  postgres_data:
  qdrant_storage:

networks:
  n8n_network:
    driver: bridge
