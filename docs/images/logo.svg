<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="amber-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="slate-plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 512)" filter="url(#subtle-shadow)">

      <!-- Hexagonal Architectural Gateway Frame -->
      <polygon points="
        0,-390
        338,-195
        338,195
        0,390
        -338,195
        -338,-195
      " fill="none" stroke="#0f172a" stroke-width="36" stroke-linejoin="round" />

      <!-- Inner Precision Dashed Cyan Circuit -->
      <polygon points="
        0,-355
        307,-177
        307,177
        0,355
        -307,177
        -307,-177
      " fill="none" stroke="#00f5ff" stroke-width="4" opacity="0.45" stroke-dasharray="16, 12" />

      <!-- Corner Alignment Accent Nodes -->
      <circle cx="0" cy="-390" r="7" fill="#00f5ff" />
      <circle cx="338" cy="-195" r="7" fill="#00f5ff" />
      <circle cx="338" cy="195" r="7" fill="#00f5ff" />
      <circle cx="0" cy="390" r="7" fill="#00f5ff" />
      <circle cx="-338" cy="195" r="7" fill="#00f5ff" />
      <circle cx="-338" cy="-195" r="7" fill="#00f5ff" />

      <!-- 100% Watertight Solid Silhouette Base (Dark Charcoal) -->
      <path d="
        M 0 -290
        L 85 -315 L 140 -270 L 160 -180 L 220 -80 L 230 40 L 195 180 L 130 290 L 0 330
        L -130 290 L -195 180 L -230 40 L -220 -80 L -160 -180 L -140 -270 L -85 -315
        Z
      " fill="#0b0f19" />

      <!-- Outer Wing Flanks & Shoulder Armor Plates -->
      <!-- Left Wing Facets -->
      <polygon points="-160,-180 -220,-80 -150,-50" fill="#1e293b" />
      <polygon points="-220,-80 -230,40 -160,50 -150,-50" fill="#0f172a" />
      <polygon points="-230,40 -195,180 -140,160 -160,50" fill="#1e293b" />
      <polygon points="-195,180 -130,290 -80,240 -140,160" fill="#0f172a" />

      <!-- Right Wing Facets -->
      <polygon points="160,-180 220,-80 150,-50" fill="#334155" />
      <polygon points="220,-80 230,40 160,50 150,-50" fill="#1e293b" />
      <polygon points="230,40 195,180 140,160 160,50" fill="#334155" />
      <polygon points="195,180 130,290 80,240 140,160" fill="#1e293b" />

      <!-- Crown Crest Feathers & Tufted Horns -->
      <!-- Center Crown -->
      <polygon points="0,-290 40,-250 0,-210 -40,-250" fill="#475569" />
      <!-- Left Ear Horn -->
      <polygon points="0,-290 -85,-315 -55,-240" fill="#1e293b" />
      <polygon points="-85,-315 -140,-270 -95,-220 -55,-240" fill="#334155" />
      <!-- Right Ear Horn -->
      <polygon points="0,-290 85,-315 55,-240" fill="#334155" />
      <polygon points="85,-315 140,-270 95,-220 55,-240" fill="#475569" />

      <!-- Forehead & Eyebrow Plates -->
      <polygon points="0,-210 -55,-240 -95,-220 -60,-170 0,-175" fill="#1e293b" />
      <polygon points="0,-210 55,-240 95,-220 60,-170 0,-175" fill="#334155" />

      <!-- Alert Eye Brows (Angular Geometric Slanted Visor) -->
      <polygon points="0,-175 -60,-170 -120,-160 -80,-130 0,-145" fill="#0f172a" />
      <polygon points="0,-175 60,-170 120,-160 80,-130 0,-145" fill="#1e293b" />

      <!-- Lateral Cheek / Facial Disk Plates -->
      <polygon points="-140,-270 -160,-180 -120,-160 -95,-220" fill="#0f172a" />
      <polygon points="140,-270 160,-180 120,-160 95,-220" fill="#1e293b" />

      <polygon points="-160,-180 -150,-50 -90,-90 -120,-160" fill="#1e293b" />
      <polygon points="160,-180 150,-50 90,-90 120,-160" fill="#334155" />

      <!-- Predatory Optical Sensor Eyes (Electric Cyan with Amber Pupils) -->
      <!-- Left Eye Orbit & Sensor -->
      <polygon points="-80,-130 -120,-160 -130,-120 -80,-100" fill="#0284c7" />
      <polygon points="-75,-126 -115,-150 -120,-122 -78,-106" fill="url(#cyan-glow)" />
      <!-- Left Vertical Sensor Pupil (Hex slit) -->
      <polygon points="-98,-140 -93,-136 -93,-122 -98,-118 -103,-122 -103,-136" fill="#0b0f19" />
      <polygon points="-98,-137 -95,-134 -95,-124 -98,-121 -101,-124 -101,-134" fill="url(#amber-core)" />

      <!-- Right Eye Orbit & Sensor -->
      <polygon points="80,-130 120,-160 130,-120 80,-100" fill="#0284c7" />
      <polygon points="75,-126 115,-150 120,-122 78,-106" fill="url(#cyan-glow)" />
      <!-- Right Vertical Sensor Pupil (Hex slit) -->
      <polygon points="98,-140 103,-136 103,-122 98,-118 93,-122 93,-136" fill="#0b0f19" />
      <polygon points="98,-137 101,-134 101,-124 98,-121 95,-124 95,-134" fill="url(#amber-core)" />

      <!-- Central Beak Wedge (Auditor Diamond) -->
      <polygon points="0,-145 -30,-100 0,-40" fill="#1e293b" />
      <polygon points="0,-145 30,-100 0,-40" fill="#334155" />
      <polygon points="0,-40 -18,-15 0,10" fill="#d97706" />
      <polygon points="0,-40 18,-15 0,10" fill="url(#amber-core)" />

      <!-- Muzzle / Throat Facets -->
      <polygon points="-30,-100 -80,-100 -55,-40 0,-40" fill="#0f172a" />
      <polygon points="30,-100 80,-100 55,-40 0,-40" fill="#1e293b" />
      <polygon points="-55,-40 -90,-90 -100,-10 -50,30 0,10" fill="#1e293b" />
      <polygon points="55,-40 90,-90 100,-10 50,30 0,10" fill="#334155" />

      <!-- Chest Heraldic Breastplate (Autonomous Multi-Agent Core) -->
      <!-- Center High Breastplate -->
      <polygon points="0,10 -50,30 -60,110 0,140" fill="#1e293b" />
      <polygon points="0,10 50,30 60,110 0,140" fill="#334155" />

      <!-- Mid Chest Ribs -->
      <polygon points="-60,110 -140,70 -120,150 -50,180 0,140" fill="#0f172a" />
      <polygon points="60,110 140,70 120,150 50,180 0,140" fill="#1e293b" />

      <polygon points="-50,30 -100,-10 -150,-50 -160,50 -140,70 -60,110" fill="#1e293b" />
      <polygon points="50,30 100,-10 150,-50 160,50 140,70 60,110" fill="#334155" />

      <!-- Lower Abdominal Core (RAG & Ledger Engine Plate) -->
      <polygon points="0,140 -50,180 0,250" fill="#1e293b" />
      <polygon points="0,140 50,180 0,250" fill="#475569" />

      <polygon points="-50,180 -120,150 -140,160 -80,240 0,250" fill="#0f172a" />
      <polygon points="50,180 120,150 140,160 80,240 0,250" fill="#1e293b" />

      <!-- Tail & Base Keel Feathers -->
      <polygon points="0,250 -80,240 -50,310 0,330" fill="#0f172a" />
      <polygon points="0,250 80,240 50,310 0,330" fill="#1e293b" />

      <!-- Central Quantum Core (Negative Space Hexagonal Conduit in Chest) -->
      <polygon points="0,75 22,88 22,112 0,125 -22,112 -22,88" fill="#0b0f19" stroke="#00f5ff" stroke-width="3" />
      <circle cx="0" cy="100" r="5" fill="url(#cyan-glow)" />

    </g>
  </g>
</svg>